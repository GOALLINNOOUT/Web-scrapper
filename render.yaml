services:
  - type: keyvalue
    name: web-intel-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: web-intel-load-balancer
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.load-balancer
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: BACKENDS
        sync: false

  - type: web
    name: web-intel-api-1
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.api
    healthCheckPath: /health
    envVars: &apiEnv
      - key: NODE_ENV
        value: production
      - key: PERFORMANCE_MODE
        value: production
      - key: PORT
        value: "4000"
      - key: WEB_WORKERS
        value: "1"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: web-intel-redis
          property: connectionString
      - key: CRAWLER_RESPECT_ROBOTS
        value: "false"

  - type: web
    name: web-intel-api-2
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.api
    healthCheckPath: /health
    envVars: *apiEnv

  - type: worker
    name: web-intel-rust-worker-1
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.rust-worker
    envVars: &workerEnv
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: web_intelligence
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: web-intel-redis
          property: connectionString

  - type: worker
    name: web-intel-rust-worker-2
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.rust-worker
    envVars: *workerEnv
