services:
  load-balancer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.load-balancer
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BACKENDS: http://api-1:4000,http://api-2:4000
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  api-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    expose:
      - "4000"
    ports:
      - "127.0.0.1:4001:4000"
    environment: &api-env
      NODE_ENV: production
      PERFORMANCE_MODE: production
      INSTANCE_ID: api-1
      PORT: 4000
      WEB_WORKERS: 1
      MONGODB_DB: ${MONGODB_DB:-web_intelligence}
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - redis

  api-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    expose:
      - "4000"
    ports:
      - "127.0.0.1:4002:4000"
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - redis

  rust-worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust-worker
    env_file:
      - ../.env
    environment: &worker-env
      MONGODB_DB: ${MONGODB_DB:-web_intelligence}
      REDIS_URL: redis://redis:6379
      CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-false}
      WORKER_ID: rust-worker-1
    depends_on:
      - redis

  rust-worker-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust-worker
    env_file:
      - ../.env
    environment:
      <<: *worker-env
      WORKER_ID: rust-worker-2
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
