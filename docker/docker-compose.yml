services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
      PERFORMANCE_MODE: production
      PORT: 4000
      WEB_WORKERS: 1
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      START_WORKERS_IN_API: "false"
      CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-false}
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      PERFORMANCE_MODE: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CRAWL_JOB_WORKER_CONCURRENCY: ${CRAWL_JOB_WORKER_CONCURRENCY:-4}
      CRAWL_PAGE_WORKER_CONCURRENCY: ${CRAWL_PAGE_WORKER_CONCURRENCY:-100}
      CRAWL_PAGE_WORKER_RATE: ${CRAWL_PAGE_WORKER_RATE:-50}
      CRAWLER_DOMAIN_CONCURRENCY: ${CRAWLER_DOMAIN_CONCURRENCY:-4}
      CRAWLER_DOMAIN_RATE_PER_SECOND: ${CRAWLER_DOMAIN_RATE_PER_SECOND:-5}
      CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-false}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
