version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    deploy:
      replicas: 3
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_WORKERS: 4
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      START_WORKERS_IN_API: "false"
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    deploy:
      replicas: 10
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      CRAWL_PAGE_WORKER_CONCURRENCY: 100
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
