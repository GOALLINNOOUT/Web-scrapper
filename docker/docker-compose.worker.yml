services:
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PERFORMANCE_MODE: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      CRAWL_JOB_WORKER_CONCURRENCY: ${CRAWL_JOB_WORKER_CONCURRENCY:-4}
      CRAWL_PAGE_WORKER_CONCURRENCY: ${CRAWL_PAGE_WORKER_CONCURRENCY:-100}
      CRAWL_PAGE_WORKER_RATE: ${CRAWL_PAGE_WORKER_RATE:-50}
      CRAWLER_DOMAIN_CONCURRENCY: ${CRAWLER_DOMAIN_CONCURRENCY:-4}
      CRAWLER_DOMAIN_RATE_PER_SECOND: ${CRAWLER_DOMAIN_RATE_PER_SECOND:-5}
      CRAWLER_RENDER_CONCURRENCY: ${CRAWLER_RENDER_CONCURRENCY:-4}
      CRAWLER_RENDER_RATE: ${CRAWLER_RENDER_RATE:-10}
      CRAWLER_RENDER_TIMEOUT_MS: ${CRAWLER_RENDER_TIMEOUT_MS:-15000}
      CRAWLER_RENDER_QUEUE_MAX: ${CRAWLER_RENDER_QUEUE_MAX:-500}
      CRAWLER_BLOCK_RENDER_ASSETS: ${CRAWLER_BLOCK_RENDER_ASSETS:-true}
      CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-false}
